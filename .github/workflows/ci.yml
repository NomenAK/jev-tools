name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_call:

permissions:
  contents: read

jobs:
  checks:
    name: Node 24 offline checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
      - name: Install dependencies (including native optional packages)
        run: npm ci --include=optional
      - name: Typecheck
        run: npm run typecheck
      - name: Build MCP server
        run: npm run build
      - name: MCP package check (packed server answers over stdio)
        run: |
          mkdir -p "$RUNNER_TEMP/pack"
          npm pack --pack-destination "$RUNNER_TEMP/pack" > /dev/null
          node scripts/check-mcp-package.ts "$RUNNER_TEMP"/pack/*.tgz
      - name: Import boundaries
        run: npm run check:imports
      - name: Lint
        run: npm run lint
      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'
      - name: Install pytest for native identity checks
        run: python -m pip install pytest
      - name: Install isolated Vitest 4 identity runner
        run: npm install --prefix "$HOME/.cache/jev-tools/vitest4-identity" vitest@4.1.11
      - name: Install isolated Vitest 5 identity runner
        run: npm install --prefix "$HOME/.cache/jev-tools/vitest5-identity" vitest@5.0.3
      - name: Install isolated additional identity runners
        run: npm install --prefix "$HOME/.cache/jev-tools/additional-identities" ava@6.4.1 mocha@11.8.0 deno@2.9.6
      - name: Offline tests
        run: AVA_EXECUTABLE="$HOME/.cache/jev-tools/additional-identities/node_modules/.bin/ava" MOCHA_EXECUTABLE="$HOME/.cache/jev-tools/additional-identities/node_modules/.bin/mocha" DENO_EXECUTABLE="$HOME/.cache/jev-tools/additional-identities/node_modules/.bin/deno" VITEST4_EXECUTABLE="$HOME/.cache/jev-tools/vitest4-identity/node_modules/.bin/vitest" VITEST5_EXECUTABLE="$HOME/.cache/jev-tools/vitest5-identity/node_modules/.bin/vitest" npm test

  native-mcp:
    name: MCP on ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
      - name: Install dependencies
        run: npm ci --include=optional
      - name: Typecheck and build
        run: npm run typecheck && npm run build
      - name: Diagnose nested Windows process tree
        if: runner.os == 'Windows'
        run: node scripts/probe-windows-tree.ts
      - name: Native MCP, configuration and process regressions
        run: node --test test/mcp.test.ts test/mcp-shutdown.test.ts test/process-tree.test.ts test/platform-paths.test.ts test/private-storage.test.ts test/configuration.test.ts test/secret-input.test.ts test/budget-concurrency.test.ts test/check-mcp-package.test.ts test/check-mcp-registry.test.ts test/server-json.test.ts
      - name: Installed MCP package smoke
        run: |
          mkdir -p "$RUNNER_TEMP/pack"
          npm pack --pack-destination "$RUNNER_TEMP/pack" > /dev/null
          node scripts/check-mcp-package.ts "$RUNNER_TEMP"/pack/*.tgz
