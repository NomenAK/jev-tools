# Maintainer prerequisites: protect the npm-publish environment with an approval
# gate, and set its EXPECTED_PACKAGE_INTEGRITY variable to the independently
# verified candidate's SHA-512 integrity before approval. Prepare that candidate
# with the same pinned toolchain as this workflow: Node.js 24.15.0 / npm 11.12.1.
# A rerun skips publication only if the existing version's registry integrity
# equals the approved tarball; mismatches and inconclusive lookups fail.
# Configure the npm trusted publisher for this repository, publish.yml and
# npm-publish with permission for direct publication. Publishing uses OIDC only.
# The GitHub Release remains a draft until the published package is verified.
# After npm publication, the mcp-registry job publishes server.json (copied at
# pack time) to the official MCP Registry with GitHub OIDC; no secret is needed.
# It runs release-artifact/check-mcp-registry.ts (also copied at pack time),
# which first requires release-artifact/server.json to equal the server.json
# embedded in the approved tarball, then reports skip only for a registry 200
# whose server envelope equals the reviewed definition (404 means absent).
# Keep server.json's versions equal to package.json (test/server-json.test.ts
# and scripts/check-mcp-package.ts enforce it).

name: Publish

on:
  push:
    tags: ['v*.*.*']

permissions:
  contents: read

concurrency:
  group: npm-publish
  cancel-in-progress: false

jobs:
  validate:
    name: Validate release tag
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v5
        with:
          node-version: 24.15.0
      - name: Check tag, package version and reviewed main history
        env:
          RELEASE_TAG: ${{ github.ref_name }}
          RELEASE_SHA: ${{ github.sha }}
        run: |
          node --input-type=module <<'NODE'
          import { readFileSync } from 'node:fs';
          const { version } = JSON.parse(readFileSync('package.json', 'utf8'));
          const tag = process.env.RELEASE_TAG;
          if (!/^v(0|[1-9]\d*)\.(0|[1-9]\d*)\.(0|[1-9]\d*)$/.test(tag) || tag !== `v${version}`) {
            throw new Error(`Tag ${tag} must be v${version} (stable SemVer only).`);
          }
          console.log(`Validated ${tag} against package version ${version}.`);
          NODE
          test "$(git rev-parse HEAD)" = "$(git rev-parse "$RELEASE_SHA^{commit}")"
          git merge-base --is-ancestor HEAD refs/remotes/origin/main

  checks:
    name: Public checks
    needs: validate
    uses: ./.github/workflows/ci.yml
    permissions:
      contents: read

  prepare:
    name: Pack release candidate once
    needs: checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - uses: actions/setup-node@v5
        with:
          node-version: 24.15.0
      - name: Pin npm for packing and publishing
        run: npm install --global npm@11.12.1
      - name: Install dependencies
        run: npm ci --include=optional
      - name: Pack and record integrity, file list and release notes
        run: |
          mkdir release-artifact
          node --version > release-artifact/node-version.txt
          npm --version > release-artifact/npm-version.txt
          npm pack --json --pack-destination release-artifact > release-artifact/pack.json
          node --input-type=module <<'NODE'
          import { createHash } from 'node:crypto';
          import { readFileSync, writeFileSync } from 'node:fs';
          const [pack, ...extra] = JSON.parse(readFileSync('release-artifact/pack.json', 'utf8'));
          if (!pack || extra.length) throw new Error('Expected exactly one packed tarball.');
          const integrity = `sha512-${createHash('sha512').update(readFileSync(`release-artifact/${pack.filename}`)).digest('base64')}`;
          if (integrity !== pack.integrity) throw new Error('Pack integrity does not match tarball bytes.');
          writeFileSync('release-artifact/integrity.txt', `${integrity}\n`);
          writeFileSync('release-artifact/files.txt', pack.files.map(file => file.path).join('\n') + '\n');
          const lines = readFileSync('CHANGELOG.md', 'utf8').split('\n');
          const start = lines.findIndex(line => line === `## [${pack.version}]` || line.startsWith(`## [${pack.version}] - `));
          if (start < 0) throw new Error(`Missing CHANGELOG section for ${pack.version}.`);
          let end = start + 1;
          while (end < lines.length && !/^## |^\[[^\]]+\]:/.test(lines[end])) end++;
          const notes = lines.slice(start + 1, end).join('\n').trim();
          if (!notes) throw new Error('Release notes must not be empty.');
          writeFileSync('release-artifact/notes.md', `${notes}\n`);
          console.log(`Packed ${pack.name}@${pack.version}: ${integrity}; ${pack.files.length} files.`);
          NODE
      - name: Check the packed MCP server and its registry metadata
        run: |
          # The registry entry is published from this exact copy, not a later checkout.
          # The registry helper travels with it, so the mcp-registry job runs the
          # reviewed script from the artifact, not a later checkout.
          cp server.json release-artifact/server.json
          cp scripts/check-mcp-registry.ts release-artifact/check-mcp-registry.ts
          node scripts/check-mcp-package.ts "release-artifact/$(node -p "require('./release-artifact/pack.json')[0].filename")"
      - uses: actions/upload-artifact@v4
        with:
          name: release-candidate
          path: release-artifact/
          if-no-files-found: error
          retention-days: 30

  publish:
    name: Publish approved tarball
    needs: prepare
    runs-on: ubuntu-latest
    environment: npm-publish
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/setup-node@v5
        with:
          node-version: 24.15.0
          registry-url: https://registry.npmjs.org
      - name: Pin npm for packing and publishing
        run: npm install --global npm@11.12.1
      - uses: actions/download-artifact@v4
        with:
          name: release-candidate
          path: release-artifact
      - name: Verify tarball against independently approved integrity
        env:
          EXPECTED_PACKAGE_INTEGRITY: ${{ vars.EXPECTED_PACKAGE_INTEGRITY }}
        run: |
          node --input-type=module <<'NODE'
          import { createHash } from 'node:crypto';
          import { readFileSync, appendFileSync } from 'node:fs';
          const [pack] = JSON.parse(readFileSync('release-artifact/pack.json', 'utf8'));
          const integrity = `sha512-${createHash('sha512').update(readFileSync(`release-artifact/${pack.filename}`)).digest('base64')}`;
          const recorded = readFileSync('release-artifact/integrity.txt', 'utf8').trim();
          if (integrity !== recorded || integrity !== pack.integrity || integrity !== process.env.EXPECTED_PACKAGE_INTEGRITY) {
            throw new Error('Tarball integrity differs from recorded or independently approved integrity. Set EXPECTED_PACKAGE_INTEGRITY in npm-publish before approval.');
          }
          // Leading "./" makes npm treat the path as a local tarball, not a GitHub "owner/repo" spec.
          appendFileSync(process.env.GITHUB_ENV, `PACKAGE_SPEC=${pack.name}@${pack.version}\nTARBALL=./release-artifact/${pack.filename}\nPACKAGE_INTEGRITY=${integrity}\n`);
          console.log(`Approved ${pack.name}@${pack.version}: ${integrity}`);
          NODE
      - name: Check registry idempotence (only E404 means absent)
        id: registry
        run: |
          node --input-type=module <<'NODE'
          import { spawnSync } from 'node:child_process';
          import { appendFileSync } from 'node:fs';
          const result = spawnSync('npm', ['view', process.env.PACKAGE_SPEC, 'dist.integrity', '--json', '--registry=https://registry.npmjs.org'], { encoding: 'utf8' });
          if (result.error) throw result.error;
          let value;
          try { value = JSON.parse(result.stdout); } catch {
            throw new Error(`Registry lookup did not return JSON: ${result.stderr}`);
          }
          if (result.status === 0) {
            if (value !== process.env.PACKAGE_INTEGRITY) throw new Error('Version already exists with different registry integrity. Refusing publication.');
            console.log('Version already exists with identical integrity; skipping publication.');
            appendFileSync(process.env.GITHUB_OUTPUT, 'exists=true\n');
          } else if (result.status !== null && value?.error?.code === 'E404') {
            console.log('Registry returned E404: version is absent.');
            appendFileSync(process.env.GITHUB_OUTPUT, 'exists=false\n');
          } else {
            throw new Error(`Registry lookup failed; absence is not established: ${result.stderr}`);
          }
          NODE
      - name: Publish with trusted publishing (OIDC)
        if: steps.registry.outputs.exists == 'false'
        run: npm publish "$TARBALL" --provenance --access public

  mcp-registry:
    name: Publish MCP Registry entry
    needs: publish
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    env:
      MCP_REGISTRY: https://registry.modelcontextprotocol.io
      # Pinned publisher; bump both together from the release's published digest.
      MCP_PUBLISHER_VERSION: v1.8.1
      MCP_PUBLISHER_SHA256: a06c9096dcb9727c13555b6be26c7effa707b01f06a4c561ba7a3635443cf2cc
    steps:
      - uses: actions/setup-node@v5
        with:
          node-version: 24.15.0
      - uses: actions/download-artifact@v4
        with:
          name: release-candidate
          path: release-artifact
      - name: Wait for the approved npm version and its mcpName
        # The registry verifies ownership by reading mcpName from npm.
        run: |
          node --input-type=module <<'NODE'
          import { spawnSync } from 'node:child_process';
          import { readFileSync } from 'node:fs';
          import { setTimeout as sleep } from 'node:timers/promises';
          const [pack] = JSON.parse(readFileSync('release-artifact/pack.json', 'utf8'));
          const server = JSON.parse(readFileSync('release-artifact/server.json', 'utf8'));
          const approved = readFileSync('release-artifact/integrity.txt', 'utf8').trim();
          const spec = `${pack.name}@${pack.version}`;
          for (let attempt = 1; attempt <= 20; attempt++) {
            const result = spawnSync('npm', ['view', spec, 'dist.integrity', 'mcpName', '--json', '--registry=https://registry.npmjs.org'], { encoding: 'utf8' });
            if (result.error) throw result.error;
            if (result.status === 0) {
              // npm prints a bare string when only one requested field exists.
              const parsed = JSON.parse(result.stdout);
              const view = typeof parsed === 'string' ? { 'dist.integrity': parsed } : parsed;
              if (view['dist.integrity'] !== approved) throw new Error(`${spec} on npm does not have the approved integrity.`);
              if (view.mcpName !== server.name) throw new Error(`${spec} on npm has mcpName ${view.mcpName}, expected ${server.name}.`);
              console.log(`${spec} is on npm with the approved integrity and mcpName ${view.mcpName}.`);
              process.exit(0);
            }
            console.log(`Attempt ${attempt}: ${spec} not visible on npm yet.`);
            await sleep(15_000);
          }
          throw new Error(`${spec} did not appear on npm within five minutes.`);
          NODE
      - name: Check the approved tarball and registry idempotence (only 404 means absent)
        id: entry
        run: |
          # Runs the reviewed helper from the artifact, not this checkout, and
          # requires release-artifact/server.json to equal the server.json
          # embedded in the approved tarball before any registry lookup.
          node release-artifact/check-mcp-registry.ts "release-artifact/server.json" "release-artifact/$(node -p "require('./release-artifact/pack.json')[0].filename")"
      - name: Install pinned mcp-publisher and validate server.json
        run: |
          curl -fsSL -o mcp-publisher.tar.gz "https://github.com/modelcontextprotocol/registry/releases/download/${MCP_PUBLISHER_VERSION}/mcp-publisher_linux_amd64.tar.gz"
          echo "${MCP_PUBLISHER_SHA256}  mcp-publisher.tar.gz" | sha256sum --check --strict
          tar -xzf mcp-publisher.tar.gz mcp-publisher
          ./mcp-publisher validate release-artifact/server.json
      - name: Publish to the MCP Registry with GitHub OIDC
        if: steps.entry.outputs.exists == 'false'
        run: |
          ./mcp-publisher login github-oidc
          ./mcp-publisher publish release-artifact/server.json

  release:
    name: Create draft release from changelog
    needs: publish
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: release-candidate
          path: release-artifact
      - name: Create draft unless the release already exists
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          # List drafts too; lookup failures must not be mistaken for absence.
          gh api --paginate "repos/$GH_REPO/releases" --jq '.[].tag_name' > release-tags.txt
          if grep -Fxq -- "$RELEASE_TAG" release-tags.txt; then
            echo 'Release already exists; leaving its content and publication state unchanged.'
          else
            gh release create "$RELEASE_TAG" --verify-tag --draft --title "$RELEASE_TAG" --notes-file release-artifact/notes.md
          fi
